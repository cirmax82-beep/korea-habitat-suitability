<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>멸종위기종 서식지 분석</title>
  <meta name="description" content="멸종위기 야생생물과 천연기념물(생물)의 생태적 특징, 종분포모형으로 계산한 서식지 적합성 지도, 연구 보고서 형식의 종별 분석리포트, 저감방안을 한곳에서 보는 사이트입니다." />
  <meta property="og:title" content="멸종위기종 서식지 분석" />
  <meta property="og:description" content="멸종위기 야생생물·천연기념물 서식지 적합성 지도와 종별 분석리포트" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230b7285'/%3E%3Cpath d='M9 22c0-7 5-12 14-13-1 9-6 14-13 14' fill='%23fff'/%3E%3Cpath d='M9 23l7-7' stroke='%230b7285' stroke-width='1.6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="inapp-bar" id="inapp-bar" hidden>
    <span>앱 안의 브라우저에서는 공간자료 파일을 받을 수 없습니다.</span>
    <button class="btn btn-sm btn-primary" id="inapp-open" type="button">크롬·사파리로 열기</button>
    <button class="icon-btn" id="inapp-close" type="button" aria-label="닫기">✕</button>
  </div>
  <header class="topbar">
    <a class="brand" href="#species">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="currentColor"/><path d="M9 22c0-7 5-12 14-13-1 9-6 14-13 14" fill="#fff"/><path d="M9 23l7-7" stroke="currentColor" stroke-width="1.6"/></svg>
      <span><strong>멸종위기종 서식지 분석</strong><small>서식지 적합성 · 분석리포트 · 저감방안</small></span>
    </a>
    <nav class="tabs">
      <a class="tab" href="#species" data-view="species">종 정보</a>
      <a class="tab" href="#report" data-view="report">분석리포트</a>
      <a class="tab" href="#about" data-view="about">자료·방법</a>
    </nav>
  </header>

  <main>
    <!-- 종 정보 -->
    <section class="view" id="view-species">
      <aside class="sp-side">
        <div class="sp-filter">
          <input id="sp-q" class="input" type="search" placeholder="국명·학명으로 찾기" autocomplete="off" />
          <div class="row">
            <select id="sp-group" class="input" aria-label="분류군"></select>
            <select id="sp-kind" class="input" aria-label="구분">
              <option value="">모든 구분</option><option value="en1">멸종위기 Ⅰ급</option><option value="en2">멸종위기 Ⅱ급</option><option value="nm">천연기념물</option>
            </select>
          </div>
        </div>
        <div class="sp-count" id="sp-count">종 목록을 불러오는 중…</div>
        <div class="sp-list" id="sp-list"></div>
      </aside>
      <div class="sp-main" id="sp-main">
        <div class="sp-empty muted" id="sp-empty">
          <p>왼쪽 목록에서 종을 고르면 생태적 특징, 서식지 적합성 지도, 주요 위협 요인과 저감방안을 볼 수 있습니다.</p>
          <p><a href="#report">분석리포트</a>에서 종마다 연구 보고서 형식의 서식지 적합성 분석 결과(표·그래프·참고문헌)를 볼 수 있습니다.</p>
        </div>
        <div class="sp-detail" id="sp-detail" hidden></div>
      </div>
    </section>

    <!-- 분석리포트 -->
    <section class="view" id="view-report">
      <div class="rp-wrap" id="rp-wrap">
        <div class="rp-bar no-print">
          <select id="rp-sel" class="input grow" aria-label="리포트를 볼 종"></select>
          <button class="btn btn-light" id="rp-csv" type="button">표 CSV</button>
          <button class="btn btn-primary" id="rp-print" type="button">인쇄·PDF</button>
        </div>
        <article class="rp-doc" id="rp-doc"></article>
      </div>
    </section>

    <!-- 자료·방법 -->
    <section class="view" id="view-about">
      <div class="page narrow about" id="about"></div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <div class="dl-sheet" id="dl-sheet" role="dialog" aria-label="파일 받기" hidden>
    <div class="dl-sheet-body">
      <div><b>파일이 준비됐습니다</b><div class="small muted" id="dl-sheet-name"></div></div>
      <p class="small dl-sheet-note" id="dl-sheet-note" hidden>카카오톡 같은 앱 안의 브라우저에서는 파일이 깨진 채 저장됩니다. 크롬·사파리로 열어서 받아 주세요.</p>
      <div class="row">
        <button class="btn btn-primary" id="dl-sheet-out" type="button" hidden>크롬·사파리로 열어 받기</button>
        <a class="btn btn-primary" id="dl-sheet-save" href="#" download>받기</a>
        <button class="btn btn-light" id="dl-sheet-share" type="button" hidden>공유·저장</button>
        <button class="btn btn-light" id="dl-sheet-close" type="button">닫기</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  <script src="js/app.js"></script>
  <script src="js/measures.js"></script>
  <script src="js/myrec.js"></script>
  <script src="js/report.js"></script>
</body>
</html>
