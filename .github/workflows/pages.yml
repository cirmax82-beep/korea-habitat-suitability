# main에 올리면 GitHub Pages로 배포합니다.
# 종별 적합성 격자(data/suit)·분석리포트 통계(data/report)·10 m 토지피복(data/lc10)은 용량이 커서 저장소 대신 릴리스(data-latest)의 site-data.zip에 두고 배포 때 받아 넣습니다.
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: 배포할 파일 모으기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/data
          cp -r index.html css js robots.txt sitemap.xml _site/
          cp data/catalog.json data/grid.json data/occ.json data/profiles.json _site/data/
          [ -f CNAME ] && cp CNAME _site/ || true
          cp naver*.html google*.html _site/ 2>/dev/null || true
          gh release download data-latest -p site-data.zip -R "$GITHUB_REPOSITORY" -D /tmp
          unzip -q /tmp/site-data.zip -d _site/data
          ls _site _site/data; du -sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
